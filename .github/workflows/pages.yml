name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with versioned asset URLs
        # Pages caches files for 10 minutes. Stamping asset URLs with the commit means a
        # fresh index.html never pairs with stale scripts, styles or the decoder worker.
        run: |
          v="${GITHUB_SHA::12}"
          rm -rf _site && cp -r site _site && rm -rf _site/tests
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
          # every relative module reference: static imports, import(), new URL('./worker.js')
          sed -i -E "s#'\./([a-z]+)\.js'#'./\1.js?v=$v'#g" _site/*.js
          grep -q "style.css?v=$v" _site/index.html
          grep -q "app.js?v=$v" _site/index.html
          if grep -nE "'\./[a-z]+\.js'" _site/*.js; then echo "unversioned module URL" >&2; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
