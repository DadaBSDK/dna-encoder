[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnastore"
version = "0.1.0"
description = "Structure- and readout-aware DNA data storage codec (research code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "ViennaRNA==2.7.2",
  "zstandard==0.24.0",
  "edlib==1.3.9.post1",
  "primer3-py==2.3.1",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
  "typer==0.20.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.168.3", "reedsolo==1.7.0"]

[project.scripts]
dnastore = "dnastore.cli:app"

[tool.setuptools.packages.find]
include = ["dnastore*"]

[tool.setuptools.package-data]
dnastore = ["resources/*.yaml", "web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs ViennaRNA MFE or large inputs"]
